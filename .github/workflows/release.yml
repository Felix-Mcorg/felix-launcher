name: Publier le launcher

# Se lance quand tu crées un tag (ex. v1.0.0) ou à la main depuis l'onglet Actions (avec un numéro de version).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Numéro de version
        id: ver
        shell: pwsh
        run: |
          $raw = "${{ github.event.inputs.version || github.ref_name }}"
          $v = $raw.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: dotnet test

      - name: "Compiler (Windows, autonome, rien à installer chez le joueur)"
        run: dotnet publish src/Felix.Launcher/Felix.Launcher.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Zip et empreinte SHA-256
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath FelixLauncher-win-x64.zip
          $hash = (Get-FileHash FelixLauncher-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  FelixLauncher-win-x64.zip" | Out-File -FilePath FelixLauncher-win-x64.zip.sha256 -Encoding ascii -NoNewline

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Felix Launcher ${{ steps.ver.outputs.version }}
          body: |
            Le démarreur (`FelixLauncher-Setup.exe`, dépôt felix-launcher-bootstrap) télécharge cette version automatiquement.
          files: |
            FelixLauncher-win-x64.zip
            FelixLauncher-win-x64.zip.sha256

  release-mac:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Numéro de version
        id: ver
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          V="${RAW#v}"
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: "Compiler (macOS ${{ matrix.rid }}, autonome)"
        run: dotnet publish src/Felix.Launcher/Felix.Launcher.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:SupportedOSPlatformVersion=11.0 -p:Version=${{ steps.ver.outputs.version }} -o publish-${{ matrix.rid }}

      - name: Empaqueter en .app, Zip et empreinte SHA-256
        run: |
          APP_DIR="FelixLauncher.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          cp -R publish-${{ matrix.rid }}/* "$APP_DIR/Contents/MacOS/"
          chmod +x "$APP_DIR/Contents/MacOS/Felix.Launcher"

          cat <<EOF > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Felix.Launcher</string>
            <key>CFBundleIdentifier</key>
            <string>org.felixmc.launcher</string>
            <key>CFBundleName</key>
            <string>Felix Launcher</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.ver.outputs.version }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF

          ditto -c -k --sequesterRsrc "$APP_DIR" "FelixLauncher-${{ matrix.rid }}.zip"
          shasum -a 256 "FelixLauncher-${{ matrix.rid }}.zip" > "FelixLauncher-${{ matrix.rid }}.zip.sha256"

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Felix Launcher ${{ steps.ver.outputs.version }}
          files: |
            FelixLauncher-${{ matrix.rid }}.zip
            FelixLauncher-${{ matrix.rid }}.zip.sha256

  release-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Numéro de version
        id: ver
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          V="${RAW#v}"
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: "Compiler (Linux ${{ matrix.rid }}, autonome)"
        run: dotnet publish src/Felix.Launcher/Felix.Launcher.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o publish-${{ matrix.rid }}

      - name: Archive tar.gz et empreinte SHA-256
        run: |
          tar -czf FelixLauncher-${{ matrix.rid }}.tar.gz -C publish-${{ matrix.rid }} .
          sha256sum FelixLauncher-${{ matrix.rid }}.tar.gz > FelixLauncher-${{ matrix.rid }}.tar.gz.sha256

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Felix Launcher ${{ steps.ver.outputs.version }}
          files: |
            FelixLauncher-${{ matrix.rid }}.tar.gz
            FelixLauncher-${{ matrix.rid }}.tar.gz.sha256
